<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mailer — Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
        .login-card { background: var(--bg2); border: 1px solid var(--border-light); border-radius: 12px;
                      padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md); }
        .login-card h1 { font-size: 24px; margin-bottom: 6px; text-align: center; }
        .login-card .subtitle { color: var(--fg2); font-size: 13px; text-align: center; margin-bottom: 28px; }
        .login-card .error { background: var(--red-light); color: var(--red); padding: 10px 14px;
                             border-radius: var(--radius); font-size: 13px; margin-bottom: 16px;
                             border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Bulk Mailer</h1>
        <p class="subtitle">Sign in to your account</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>Username</label>
            <input name="username" type="text" required autofocus placeholder="Enter username">

            <label>Password</label>
            <input name="password" type="password" required placeholder="Enter password">

            <div style="margin-top:20px">
                <button class="btn btn-primary" style="width:100%;padding:12px">Sign In</button>
            </div>
        </form>
    </div>
</body>
</html>
