<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="{{ wait_seconds }}; url={{ target }}">
<title>{{ cfg.brand_text }}</title>
<link rel="stylesheet" href="/static/style.css">
<style>
    body { background: #f5f6f8; margin:0; }
    .center { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card {
        background:white; padding:40px 32px; max-width:420px; text-align:center;
        border-radius:12px; box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .card img { max-width:180px; max-height:60px; margin-bottom:20px; }
    .spinner {
        width:38px; height:38px; border-radius:50%; margin:16px auto;
        border:3px solid #eee; border-top-color: {{ cfg.brand_color }};
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand-text { color:#333; font-size:15px; margin-top:8px; }
    .muted { color:#888; font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<div class="center">
    <div class="card">
        {% if cfg.logo_path %}
        <img src="{{ cfg.logo_path }}" alt="Logo">
        {% endif %}
        <div class="spinner"></div>
        <div class="brand-text">{{ cfg.brand_text }}</div>
        <p class="muted">
            <noscript>Falls du nicht automatisch weitergeleitet wirst, <a href="{{ target }}">hier klicken</a>.</noscript>
        </p>
    </div>
</div>
<script>
    setTimeout(function(){
        window.location.replace({{ target|tojson }});
    }, {{ wait_seconds }} * 1000);
</script>
</body>
</html>
