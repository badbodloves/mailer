<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding:30px 10px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
<!-- Logo + Referenz side by side in header -->
<tr><td style="padding:22px 40px 14px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
<tr>
<td style="vertical-align:middle;"><div style="border-left:4px solid #1a73e8;padding-left:14px;">
<p style="margin:0;font-weight:bold;color:#1a73e8;font-size:15px;font-family:Arial, Helvetica, sans-serif;">{Logo}</p>
</div></td>
<td style="vertical-align:middle;text-align:right;">
<span style="font-size:11px;color:#999999;font-family:Arial, Helvetica, sans-serif;">REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</span>
</td>
</tr>
</table>
</td></tr>
<tr><td style="padding:6px 40px 10px;"><p style="margin:0 0 14px 0;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.7;color:#333333;">{Satz1}</p>
<p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.7;color:#333333;">{Satz2}</p></td></tr>
<tr><td style="padding:4px 40px 10px;"><div style="border:1px dashed #cccccc;padding:12px 14px;border-radius:3px;">
<p style="margin:0;font-size:13px;color:#666666;font-family:Arial, Helvetica, sans-serif;">{Hinweis}</p>
</div></td></tr>
<tr><td style="padding:4px 40px 10px;"><div style="text-align:center;background-color:#fff5f5;padding:14px;border-radius:4px;border:1px solid #f5c6c6;">
<p style="margin:0 0 6px 0;font-weight:bold;color:#c0392b;font-family:Arial, Helvetica, sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#666666;font-family:Arial, Helvetica, sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:6px 40px 14px;"><a href="{RedirectLink}" style="display:inline-block;padding:10px 22px;border:2px solid #1a73e8;color:#1a73e8;text-decoration:none;font-size:14px;font-weight:bold;border-radius:4px;font-family:Arial, Helvetica, sans-serif;">{Link}</a></td></tr>
<tr><td style="padding:4px 40px 22px;"><p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:14px;color:#333333;">Mit freundlichen Grüßen<br>{Ende}</p></td></tr>
<tr><td style="padding:0;"><div style="border-top:1px solid #e0e0e0;padding-top:14px;">
<p style="margin:0;font-size:11px;color:#9e9e9e;line-height:1.5;font-family:Arial, Helvetica, sans-serif;">{Footer1}<br>{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
