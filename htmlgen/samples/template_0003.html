<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding:0 10px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0">
<!-- Full-width colored header stripe -->
<tr><td style="background-color:#0066cc;padding:22px 40px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
<tr><td style="color:#ffffff;"><p style="margin:0;font-weight:bold;color:#0066cc;font-size:14px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;text-transform:uppercase;letter-spacing:3px;">{Logo}</p></td></tr>
</table>
</td></tr>
<!-- White body -->
<tr><td style="padding:18px 40px 10px;background:#ffffff;"><p style="margin:0;font-size:11px;color:#aaaaaa;font-family:'Courier New',monospace;letter-spacing:0.5px;">REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:6px 40px 10px;background:#ffffff;"><table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="padding-bottom:14px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</td></tr>
<tr><td style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</td></tr>
</table></td></tr>
<tr><td style="padding:4px 40px 10px;background:#ffffff;"><p style="margin:0;font-style:italic;color:#666666;font-size:13px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">{Hinweis}</p></td></tr>
<tr><td style="padding:4px 40px 10px;background:#ffffff;"><div style="padding-left:14px;border-left:3px solid #0066cc;">
<strong style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">{FristText1}</strong><br>
<span style="color:#666666;font-size:13px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">{FristText2}</span>
</div></td></tr>
<tr><td style="padding:6px 40px 14px;background:#ffffff;"><div style="text-align:right;">
<a href="{RedirectLink}" style="display:inline-block;padding:10px 26px;border:2px solid #0066cc;color:#0066cc;text-decoration:none;font-size:13px;font-weight:bold;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">{Link} &rarr;</a>
</div></td></tr>
<tr><td style="padding:4px 40px 20px;background:#ffffff;"><div style="text-align:center;">
<p style="margin:0 0 4px 0;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;color:#333333;">Mit freundlichen Grüßen</p>
<p style="margin:0;font-weight:bold;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;color:#333333;">{Ende}</p>
</div></td></tr>
<tr><td style="padding:0;background:#ffffff;"><div style="background-color:#1a1a2e;padding:14px;border-radius:0 0 4px 4px;">
<p style="margin:0;font-size:11px;color:#cccccc;line-height:1.5;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">{Footer1}<br>{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
