<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f0f0f0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f0f0f0;">
<tr><td align="center" style="padding:30px 10px;">
<table role="presentation" width="640" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="padding:32px 48px 18px;"><div style="border-bottom:2px solid #2563eb;padding-bottom:14px;">
<p style="margin:0;font-weight:bold;color:#2563eb;font-size:15px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Logo}</p>
</div></td></tr>
<tr><td style="padding:0 48px 14px;"><p style="margin:0;font-size:12px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Referenz: REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:8px 48px 14px;"><table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="padding-bottom:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</td></tr>
<tr><td style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</td></tr>
</table></td></tr>
<tr><td style="padding:4px 48px 14px;"><div style="background-color:#f8f9fa;padding:10px 14px;border-radius:4px;">
<p style="margin:0;font-size:13px;color:#555555;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Hinweis}</p>
</div></td></tr>
<tr><td style="padding:4px 48px 14px;"><div style="background-color:#fff0f0;padding:14px;border-radius:6px;">
<p style="margin:0 0 5px 0;font-weight:bold;color:#c0392b;font-size:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#555555;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:8px 48px 18px;"><p style="margin:0;text-align:center;">
<a href="{RedirectLink}" style="color:#2563eb;text-decoration:underline;display:inline-block;padding:9px 20px;border:2px solid #2563eb;border-radius:4px;font-size:14px;font-weight:bold;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Link}</a>
</p></td></tr>
<tr><td style="padding:4px 48px 28px;"><p style="margin:0;border-top:1px solid #e0e0e0;padding-top:16px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:14px;color:#333333;">Mit freundlichen Grüßen<br><strong>{Ende}</strong></p></td></tr>
<tr><td style="padding:0;"><div style="border-top:1px solid #e0e0e0;padding-top:14px;">
<p style="margin:0 0 5px 0;font-size:11px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer1}</p>
<p style="margin:0;font-size:11px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
