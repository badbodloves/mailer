<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
<tr><td align="center">
<table role="presentation" width="600" cellspacing="0" cellpadding="0">
<tr><td style="padding:28px 24px 14px;"><p style="margin:0;font-weight:bold;color:#0066cc;font-size:16px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Logo}</p></td></tr>
<tr><td style="padding:0 24px 10px;"><p style="margin:0;font-size:11px;color:#9e9e9e;letter-spacing:0.5px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:6px 24px 10px;"><div style="background-color:#f5f5f5;padding:14px;border-radius:6px;">
<p style="margin:0 0 10px 0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</p>
<p style="margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</p>
</div></td></tr>
<tr><td style="padding:4px 24px 10px;"><div style="border:1px dashed #cccccc;padding:12px 14px;border-radius:3px;">
<p style="margin:0;font-size:13px;color:#666666;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Hinweis}</p>
</div></td></tr>
<tr><td style="padding:4px 24px 10px;"><div style="background-color:#d8e6f4;padding:14px 16px;border-radius:3px;">
<p style="margin:0 0 5px 0;font-weight:bold;color:#0066cc;font-size:13px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#444444;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:6px 24px 14px;"><p style="margin:0;">
<a href="{RedirectLink}" style="color:#0066cc;text-decoration:underline;font-weight:bold;font-size:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Link}</a>
</p></td></tr>
<tr><td style="padding:4px 24px 20px;"><div style="padding-left:14px;border-left:3px solid #0066cc;">
<p style="margin:0 0 2px 0;font-size:13px;color:#555555;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Mit freundlichen Grüßen</p>
<p style="margin:0;font-weight:bold;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Ende}</p>
</div></td></tr>
<tr><td style="padding:0 24px;"><table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="border-top:1px solid #e0e0e0;padding-top:14px;font-size:11px;color:#888888;line-height:1.5;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer1}<br>{Footer2}</td></tr>
</table></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
