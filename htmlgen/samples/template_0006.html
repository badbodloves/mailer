<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
<tr><td align="center">
<table role="presentation" width="600" cellspacing="0" cellpadding="0">
<tr><td style="padding:28px 24px 14px;"><div style="border-left:4px solid #0066cc;padding-left:14px;">
<p style="margin:0;font-weight:bold;color:#0066cc;font-size:15px;font-family:Arial, Helvetica, sans-serif;">{Logo}</p>
</div></td></tr>
<tr><td style="padding:0 24px 10px;"><p style="margin:0;font-size:12px;color:#777777;font-family:Arial, Helvetica, sans-serif;"><strong>Referenz:</strong> REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:6px 24px 10px;"><table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="padding-bottom:14px;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</td></tr>
<tr><td style="font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</td></tr>
</table></td></tr>
<tr><td style="padding:4px 24px 10px;"><p style="margin:0;font-size:13px;color:#777777;padding:10px;border:1px solid #d5d5d5;border-radius:3px;font-family:Arial, Helvetica, sans-serif;">{Hinweis}</p></td></tr>
<tr><td style="padding:4px 24px 10px;"><div style="text-align:center;background-color:#fff5f5;padding:14px;border-radius:4px;border:1px solid #f5c6c6;">
<p style="margin:0 0 6px 0;font-weight:bold;color:#c0392b;font-family:Arial, Helvetica, sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#666666;font-family:Arial, Helvetica, sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:6px 24px 14px;"><p style="margin:0;text-align:center;">
<a href="{RedirectLink}" style="color:#0066cc;text-decoration:underline;display:inline-block;padding:9px 20px;border:2px solid #0066cc;border-radius:4px;font-size:14px;font-weight:bold;font-family:Arial, Helvetica, sans-serif;">{Link}</a>
</p></td></tr>
<tr><td style="padding:4px 24px 20px;"><div style="padding-left:14px;border-left:3px solid #0066cc;">
<p style="margin:0 0 2px 0;font-size:13px;color:#555555;font-family:Arial, Helvetica, sans-serif;">Mit freundlichen Grüßen</p>
<p style="margin:0;font-weight:bold;font-family:Arial, Helvetica, sans-serif;">{Ende}</p>
</div></td></tr>
<tr><td style="padding:0 24px;"><div style="border-top:2px solid #0066cc;padding-top:14px;">
<p style="margin:0;font-size:11px;color:#aaaaaa;line-height:1.5;font-family:Arial, Helvetica, sans-serif;">{Footer1}<br>{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
