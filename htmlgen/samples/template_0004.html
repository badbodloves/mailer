<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Calibri, 'Trebuchet MS', sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding:30px 10px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:6px;overflow:hidden;">
<tr><td style="padding:24px 40px 14px;"><p style="margin:0;font-weight:bold;color:#2563eb;font-size:14px;font-family:Calibri, 'Trebuchet MS', sans-serif;text-transform:uppercase;letter-spacing:3px;">{Logo}</p></td></tr>
<tr><td style="padding:6px 40px 10px;"><div style="border-left:4px solid #2563eb;padding-left:16px;">
<p style="margin:0 0 12px 0;font-family:Calibri, 'Trebuchet MS', sans-serif;font-size:15px;line-height:1.7;color:#333333;">{Satz1}</p>
<p style="margin:0;font-family:Calibri, 'Trebuchet MS', sans-serif;font-size:15px;line-height:1.7;color:#333333;">{Satz2}</p>
</div></td></tr>
<tr><td style="padding:4px 40px 10px;"><div style="background-color:#d8e6f4;padding:12px 14px;border-left:3px solid #2563eb;border-radius:0 3px 3px 0;">
<p style="margin:0;font-size:13px;color:#555555;font-family:Calibri, 'Trebuchet MS', sans-serif;">{Hinweis}</p>
</div></td></tr>
<tr><td style="padding:6px 40px 14px;"><a href="{RedirectLink}" style="display:inline-block;padding:10px 22px;border:2px solid #2563eb;color:#2563eb;text-decoration:none;font-size:14px;font-weight:bold;border-radius:4px;font-family:Calibri, 'Trebuchet MS', sans-serif;">{Link}</a></td></tr>
<tr><td style="padding:4px 40px 16px;"><p style="margin:0;font-family:Calibri, 'Trebuchet MS', sans-serif;font-size:14px;color:#333333;"><em>Mit freundlichen Grüßen</em><br><strong>{Ende}</strong></p></td></tr>
<!-- Footer area with frist + referenz pulled down -->
<tr><td style="border-top:1px solid #eeeeee;padding:16px 40px 8px;"><div style="background-color:#fff5f5;padding:14px;border-radius:4px;border-left:3px solid #c0392b;">
<p style="margin:0 0 5px 0;font-weight:bold;color:#c0392b;font-family:Calibri, 'Trebuchet MS', sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#666666;font-family:Calibri, 'Trebuchet MS', sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:4px 40px 8px;"><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
<tr><td style="background-color:#f7f7f7;padding:6px 10px;border-radius:3px;font-size:11px;color:#9e9e9e;font-family:Calibri, 'Trebuchet MS', sans-serif;">REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</td></tr>
</table></td></tr>
<tr><td style="padding:0;"><div style="background-color:#fafafa;padding:14px;border-top:1px solid #e0e0e0;">
<p style="margin:0;font-size:11px;color:#9e9e9e;line-height:1.5;font-family:Calibri, 'Trebuchet MS', sans-serif;">{Footer1}<br>{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
