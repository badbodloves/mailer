<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding:30px 10px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:6px;overflow:hidden;">
<tr><td style="padding:24px 40px 14px;"><p style="margin:0;font-weight:bold;color:#0066cc;font-size:16px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Logo}</p></td></tr>
<tr><td style="padding:6px 40px 10px;"><table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="padding-bottom:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</td></tr>
<tr><td style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</td></tr>
</table></td></tr>
<tr><td style="padding:4px 40px 10px;"><div style="border-top:1px solid #e0e0e0;padding-top:12px;">
<p style="margin:0;font-size:13px;font-style:italic;color:#666666;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Hinweis}</p>
</div></td></tr>
<tr><td style="padding:6px 40px 14px;"><p style="margin:0;text-align:center;">
<a href="{RedirectLink}" style="color:#0066cc;text-decoration:underline;display:inline-block;padding:9px 20px;border:2px solid #0066cc;border-radius:4px;font-size:14px;font-weight:bold;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Link}</a>
</p></td></tr>
<tr><td style="padding:4px 40px 16px;"><div style="padding-left:14px;border-left:3px solid #0066cc;">
<p style="margin:0 0 2px 0;font-size:13px;color:#555555;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Mit freundlichen Grüßen</p>
<p style="margin:0;font-weight:bold;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Ende}</p>
</div></td></tr>
<!-- Footer area with frist + referenz pulled down -->
<tr><td style="border-top:1px solid #eeeeee;padding:16px 40px 8px;"><div style="padding-left:14px;border-left:3px solid #0066cc;">
<strong style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText1}</strong><br>
<span style="color:#666666;font-size:13px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText2}</span>
</div></td></tr>
<tr><td style="padding:4px 40px 8px;"><p style="margin:0;font-size:11px;color:#aaaaaa;font-family:'Courier New',monospace;letter-spacing:0.5px;">REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:0;"><div style="border-top:1px solid #e0e0e0;padding-top:14px;">
<p style="margin:0 0 5px 0;font-size:11px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer1}</p>
<p style="margin:0;font-size:11px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer2}</p>
</div></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
