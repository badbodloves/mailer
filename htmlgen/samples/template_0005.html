<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;">
<tr><td align="center" style="padding:20px 10px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:4px;border:1px solid #e8e8e8;">
<tr><td style="padding:20px 32px 10px;"><div style="border:1px solid #d5d5d5;padding:12px 16px;border-radius:4px;">
<p style="margin:0;font-weight:bold;color:#2563eb;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Logo}</p>
</div></td></tr>
<tr><td style="padding:0 32px 8px;"><p style="margin:0;font-size:12px;color:#888888;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Referenz: REF-[RANDSTR:2:A-Z:upper]5B1[RANDSTR:3:A-Z:upper]</p></td></tr>
<tr><td style="padding:4px 32px 8px;"><div style="background-color:#f8f9fa;padding:14px;border-radius:6px;">
<p style="margin:0 0 10px 0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz1}</p>
<p style="margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:15px;line-height:1.6;color:#333333;">{Satz2}</p>
</div></td></tr>
<tr><td style="padding:2px 32px 8px;"><p style="margin:0;font-size:13px;color:#666666;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Hinweis}</p></td></tr>
<tr><td style="padding:2px 32px 8px;"><div style="background-color:#fff0f0;padding:14px;border-radius:6px;">
<p style="margin:0 0 5px 0;font-weight:bold;color:#c0392b;font-size:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText1}</p>
<p style="margin:0;font-size:13px;color:#555555;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{FristText2}</p>
</div></td></tr>
<tr><td style="padding:4px 32px 10px;"><p style="margin:0;">
<a href="{RedirectLink}" style="color:#2563eb;text-decoration:underline;font-weight:bold;font-size:14px;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">&#x27A4; {Link}</a>
</p></td></tr>
<tr><td style="padding:2px 32px 16px;"><p style="margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size:14px;color:#333333;">Mit freundlichen Grüßen<br>{Ende}</p></td></tr>
<tr><td style="padding:0;"><table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
<tr><td style="border-top:1px solid #e0e0e0;padding-top:14px;font-size:11px;color:#888888;line-height:1.5;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{Footer1}<br>{Footer2}</td></tr>
</table></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
