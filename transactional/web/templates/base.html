<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactional Mailer{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-brand"><h2>Transactional</h2><small>Mass Mailer Panel</small></div>
        <div class="sidebar-section">Campaign</div>
        <a href="/campaigns" class="{{ 'active' if active == 'campaigns' }}"><span class="nav-icon">&#9654;</span><span>Campaign</span></a>
        <div class="sidebar-section">Content</div>
        <a href="/templates" class="{{ 'active' if active == 'templates' }}"><span class="nav-icon">&#9998;</span><span>HTML Editor</span></a>
        <a href="/macros" class="{{ 'active' if active == 'macros' }}"><span class="nav-icon">{x}</span><span>Macros</span></a>
        <a href="/logos" class="{{ 'active' if active == 'logos' }}"><span class="nav-icon">&#128247;</span><span>Logos</span></a>
        <a href="/redirects" class="{{ 'active' if active == 'redirects' }}"><span class="nav-icon">&#128279;</span><span>Redirects</span></a>
        <div class="sidebar-section">Data</div>
        <a href="/smtps" class="{{ 'active' if active == 'smtps' }}"><span class="nav-icon">&#9993;</span><span>SMTP Lists</span></a>
        <a href="/leads" class="{{ 'active' if active == 'leads' }}"><span class="nav-icon">&#9776;</span><span>Lead Lists</span></a>
        <div class="sidebar-section">System</div>
        <a href="/config" class="{{ 'active' if active == 'config' }}"><span class="nav-icon">&#9881;</span><span>Config</span></a>
        <a href="/settings" class="{{ 'active' if active == 'settings' }}"><span class="nav-icon">&#9776;</span><span>Logs</span></a>
        <div style="flex:1"></div>
        <div style="border-top:1px solid var(--border-light);padding:10px 12px">
            <a href="/logout" style="font-size:12px;color:var(--red)"><span class="nav-icon">&#10140;</span><span>Logout</span></a>
        </div>
    </nav>
    <div class="main">{% block content %}{% endblock %}</div>
    <script>
    function showTab(container, tabId) {
        const wrap = typeof container === 'string' ? document.getElementById(container) : (container.closest('.card') || container.closest('.tab-wrap') || container.closest('details') || container.closest('.details-body'));
        if (!wrap) return;
        wrap.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        wrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const tab = document.getElementById(tabId);
        if (tab) tab.classList.add('active');
        if (event && event.target) event.target.classList.add('active');
    }
    </script>
</body>
</html>
